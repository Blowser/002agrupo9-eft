trigger:
- main

pool:
  vmImage: 'ubuntu-24.04'

variables:
- group: vg-eft-iac

stages:

- stage: Validate
  displayName: 'Validar conexión Azure'

  jobs:
  - job: ValidateAzure

    steps:

    - task: AzureCLI@2
      displayName: 'Validar suscripción Azure'
      inputs:
        azureSubscription: '$(azureServiceConnection)'
        scriptType: bash
        scriptLocation: inlineScript
        inlineScript: |

          set -e

          echo "Validando conexión Azure..."

          az account show

          echo "Conexión ARM validada correctamente."

- stage: Deploy
  displayName: 'Desplegar infraestructura'

  dependsOn: Validate

  jobs:
  - job: DeployInfra

    steps:

    - task: AzureCLI@2
      displayName: 'Crear infraestructura Azure'
      inputs:
        azureSubscription: '$(azureServiceConnection)'
        scriptType: bash
        scriptLocation: inlineScript
        inlineScript: |

          set -e

          echo "Creando Resource Group..."

          az group create \
            --name $(resourceGroupName) \
            --location $(location)

          echo "Creando VNET..."

          az network vnet create \
            --resource-group $(resourceGroupName) \
            --name $(virtualNetworkName) \
            --address-prefix $(addressPrefix) \
            --subnet-name $(subnetName) \
            --subnet-prefix $(subnetPrefix)

          echo "Creando NSG..."

          az network nsg create \
            --resource-group $(resourceGroupName) \
            --name $(securityGroupName)

          echo "Configurando SSH seguro..."

          az network nsg rule create \
            --resource-group $(resourceGroupName) \
            --nsg-name $(securityGroupName) \
            --name AllowSSH \
            --protocol Tcp \
            --direction Inbound \
            --priority 1000 \
            --source-address-prefix $(adminIp) \
            --source-port-range '*' \
            --destination-address-prefix '*' \
            --destination-port-range 22 \
            --access Allow

          echo "Configurando HTTP..."

          az network nsg rule create \
            --resource-group $(resourceGroupName) \
            --nsg-name $(securityGroupName) \
            --name AllowHTTP \
            --protocol Tcp \
            --direction Inbound \
            --priority 1001 \
            --source-address-prefix '*' \
            --source-port-range '*' \
            --destination-address-prefix '*' \
            --destination-port-range 80 \
            --access Allow

          echo "Creando IP pública..."

          az network public-ip create \
            --resource-group $(resourceGroupName) \
            --name $(publicIpName) \
            --sku Standard \
            --allocation-method Static

          echo "Creando VM Ubuntu 24.04..."

          az vm create \
            --resource-group $(resourceGroupName) \
            --name $(vmName) \
            --image Ubuntu2404 \
            --size $(vmSize) \
            --admin-username $(adminUsername) \
            --admin-password $(adminPassword) \
            --vnet-name $(virtualNetworkName) \
            --subnet $(subnetName) \
            --nsg $(securityGroupName) \
            --public-ip-address $(publicIpName)

          echo "Infraestructura creada correctamente."

          echo "IP pública obtenida:"

          az vm show \
            --resource-group $(resourceGroupName) \
            --name $(vmName) \
            --show-details \
            --query publicIps \
            -o tsv