trigger: none

variables:
- group: vg-eft-deploy

stages:

# ============================================================
# STAGE 1 - BOOTSTRAP
# Instala Docker en la VM si no existe
# ============================================================

- stage: Bootstrap
  displayName: 'Preparar VM'

  jobs:

  - job: PrepareVM
    displayName: 'Bootstrap VM'

    pool:
      vmImage: 'ubuntu-latest'

    steps:

    - checkout: none

    - task: AzureCLI@2
      displayName: 'Instalar Docker en VM'
      inputs:
        azureSubscription: '$(azureServiceConnection)'
        scriptType: bash
        scriptLocation: inlineScript
        inlineScript: |

          set -e

          BOOTSTRAP_SCRIPT=$(cat <<EOF
          set -e

          export DEBIAN_FRONTEND=noninteractive

          if ! command -v docker >/dev/null 2>&1
          then

            apt-get update

            apt-get install -y docker.io

            systemctl enable docker

            systemctl start docker

            groupadd -f docker

            usermod -aG docker $(vmUser)

          fi

          docker --version

          echo "__BOOTSTRAP_OK__"
          EOF
          )

          RESULT=$(az vm run-command invoke \
            --resource-group "$(resourceGroupName)" \
            --name "$(virtualMachineName)" \
            --command-id RunShellScript \
            --scripts "${BOOTSTRAP_SCRIPT}" \
            --query "value[0].message" \
            --output tsv)

          echo "${RESULT}"

          echo "${RESULT}" | grep "__BOOTSTRAP_OK__"

# ============================================================
# STAGE 2 - DEPLOY
# ============================================================

- stage: Deploy
  displayName: 'Deploy Snake'

  dependsOn: Bootstrap

  jobs:

  - deployment: DeploySnake

    displayName: 'Deploy Snake'

    environment:
      name: $(environmentName)
      resourceType: VirtualMachine

    strategy:

      runOnce:

        deploy:

          steps:

          - checkout: none

          - script: |

              set -e

              echo "===== DOCKER ====="

              sudo docker --version

              echo "===== LOGIN ACR ====="

              echo "$(acrPassword)" | sudo docker login \
                $(acrName).azurecr.io \
                -u $(acrUsername) \
                --password-stdin

              echo "===== PULL ====="

              sudo docker pull \
                $(acrName).azurecr.io/$(imageRepository):$(imageTag)

              echo "===== LIMPIEZA ====="

              sudo docker stop $(containerName) || true

              sudo docker rm $(containerName) || true

              echo "===== START CONTAINER ====="

              sudo docker run -d \
                --restart unless-stopped \
                --name $(containerName) \
                -p $(hostPort):$(containerPort) \
                $(acrName).azurecr.io/$(imageRepository):$(imageTag)

              echo "===== VALIDACION ====="

              sudo docker ps

              echo "===== HEALTH CHECK ====="

              HEALTH_OK=false

              for i in {1..15}
              do

                echo "Intento ${i}/15"

                if curl -f http://localhost > /dev/null 2>&1
                then

                  HEALTH_OK=true

                  echo "Aplicación disponible"

                  break

                fi

                sleep 2

              done

              if [ "$HEALTH_OK" = false ]
              then

                echo "ERROR: La aplicación no respondió después de 30 segundos"

                sudo docker logs $(containerName)

                exit 1

              fi

              echo "Health check OK"

            displayName: 'Deploy Snake Container'