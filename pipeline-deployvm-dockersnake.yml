trigger: none

variables:
- group: vg-eft-deploy

stages:

- stage: Deploy
  displayName: 'Deploy Snake'

  jobs:

  - deployment: DeploySnake

    displayName: 'Deploy Snake Container'

    environment: 'env-002agrupo9-eft'

    strategy:
      runOnce:

        deploy:

          steps:

          - script: |

              set -e

              echo "===== INSTALACION DOCKER ====="

              if ! command -v docker > /dev/null 2>&1
              then

                echo "Docker no encontrado"

                sudo apt update

                sudo apt install -y docker.io

                sudo systemctl enable docker

                sudo systemctl start docker

                sudo usermod -aG docker azureuser

              else

                echo "Docker ya instalado"

              fi

              docker --version

              echo "===== INSTALACION AZURE CLI ====="

              if ! command -v az > /dev/null 2>&1
              then

                curl -sL https://aka.ms/InstallAzureCLIDeb | sudo bash

              fi

              az version

              echo "===== LOGIN ACR ====="

              docker login $(acrName).azurecr.io \
                -u $(acrUsername) \
                -p $(acrPassword)

              echo "===== ULTIMO TAG ====="

              IMAGE_TAG=84

              echo "Tag encontrado: ${IMAGE_TAG}"

              echo "===== PULL ====="

              docker pull $(acrName).azurecr.io/$(imageRepository):${IMAGE_TAG}

              echo "===== LIMPIEZA ====="

              docker stop $(containerName) || true

              docker rm $(containerName) || true

              echo "===== START CONTAINER ====="

              docker run -d \
                --restart unless-stopped \
                -